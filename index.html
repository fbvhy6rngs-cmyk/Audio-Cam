<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VocalCam">
<title>VocalCam - Studio Console</title>
<style>
:root{color-scheme:dark;--bg:#090a0c;--panel:#15171b;--panel2:#1f2228;--text:#f6f7fb;--muted:#a5aab4;--accent:#ff5a36;--line:#343842;--meter:#30d158}
*{box-sizing:border-box}
body{margin:0;padding:env(safe-area-inset-top) 12px calc(24px + env(safe-area-inset-bottom));background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:980px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 2px}
h1{font-size:22px;margin:0;letter-spacing:.04em;font-weight:900;text-transform:uppercase}
h2{font-size:15px;margin:0;text-transform:uppercase;letter-spacing:.08em}
.studio-tag{font-size:10px;letter-spacing:.18em;color:#ff8b70;font-weight:900;text-transform:uppercase}
.pill{border:1px solid var(--line);border-radius:99px;padding:4px 8px;font-size:11px;color:var(--muted)}

/* Preview Frame */
.preview{aspect-ratio:16/9;width:100%;min-height:220px;background:#000;border:2px solid #3e424c;border-radius:12px;overflow:hidden;position:relative;box-shadow:0 10px 28px #0008}
#cameraPreview{width:100%;height:100%;object-fit:cover;background:#000}
.status{display:flex;gap:8px;align-items:center;margin:10px 2px 12px;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#7c8290;flex:none}.dot.live{background:var(--accent)}

/* Main Toolbar */
.actions{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:9px;margin-bottom:16px}
button{font:inherit;color:var(--text);background:linear-gradient(180deg,#2a2d34,#1b1d22);border:1px solid #454953;border-radius:8px;padding:10px 8px;min-height:44px;box-shadow:inset 0 1px #ffffff0d,0 3px 0 #070809;transition:filter .12s,transform .12s;cursor:pointer}
button:active{transform:translateY(2px);box-shadow:inset 0 1px #ffffff0d,0 1px 0 #070809}
button:disabled{opacity:.45}
button.primary{background:linear-gradient(180deg,#ff704d,#d93b25);border-color:#ff886c;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
button.recording{background:linear-gradient(180deg,#b82132,#72101c);border-color:#f04b5a}

/* Studio Channel Strip (Gain & Dynamics) */
.channel-strip{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:linear-gradient(180deg,#1b1e24,#121418);border:1px solid #3a3e48;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 6px 18px #0005}
.fader-card{background:#0e1013;border:1px solid #2a2d35;border-radius:10px;padding:12px;display:flex;flex-direction:column;align-items:center}
.fader-head{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.fader-head label{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#ff8b70}
.fader-head output{font-size:12px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.fader-body{display:flex;gap:12px;align-items:center;height:160px;margin:6px 0}
.v-slider{writing-mode:bt-lr;appearance:slider-vertical;-webkit-appearance:slider-vertical;width:28px;height:100%;accent-color:var(--accent)}
.meter-bridge{width:12px;height:100%;background:#181a1f;border:1px solid #333742;border-radius:4px;display:flex;flex-direction:column-reverse;overflow:hidden;padding:2px}
.meter-fill{width:100%;height:65%;background:linear-gradient(0deg,var(--meter) 70%,#ffcc00 85%,#ff3b30 100%);border-radius:2px;transition:height .1s}

/* Accordion Drawer System */
details.drawer{background:var(--panel);border:1px solid #2e323b;border-radius:10px;margin-bottom:10px;overflow:hidden}
details.drawer[open]{border-color:#424652}
summary.drawer-header{padding:12px 14px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none;background:linear-gradient(180deg,#1c1e23,#15171b)}
summary.drawer-header::-webkit-details-marker{display:none}
summary.drawer-header::after{content:'▼';font-size:10px;color:var(--muted);transition:transform .2s}
details[open] summary.drawer-header::after{transform:rotate(180deg)}
.drawer-content{padding:14px;border-top:1px solid #282b32}

/* Grid & Controls */
.presets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.presets button{min-height:48px;padding:6px 4px;font-size:11px;font-weight:800;text-transform:uppercase;background:linear-gradient(180deg,#282b31,#17191d)}
.effectsgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.control{padding:10px;border:1px solid #323640;border-radius:8px;background:#181a1f}
.labelrow{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:4px;font-size:13px}
output{font-size:12px;color:#d7dbe4;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);height:24px;margin:0}
.note,.small{color:var(--muted);font-size:12px;line-height:1.4}
select,.field{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
#result{display:none}#recordedVideo{width:100%;background:#000;border-radius:10px;margin:8px 0}
#error{white-space:pre-wrap;color:#ffd58a;margin-top:8px;overflow-wrap:anywhere}
.librarygrid{display:grid;grid-template-columns:1fr;gap:10px}.project{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px;display:grid;gap:8px}.projecttitle{font-weight:700}.projectmeta{font-size:12px;color:var(--muted)}.projectactions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.projectactions button{padding:6px 4px;font-size:11px;min-height:36px;font-weight:700}

@media(min-width:760px){.effectsgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.preview{min-height:380px}}
@media(max-width:520px){.presets{grid-template-columns:repeat(3,minmax(0,1fr))}.effectsgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header><div><div class="studio-tag">Vocal Console Mode</div><h1>VocalCam</h1></div><span class="pill">1080p target</span></header>

<!-- Camera Viewport -->
<div class="preview"><video id="cameraPreview" autoplay muted playsinline></video></div>
<div class="status"><span id="dot" class="dot"></span><span id="status">Camera off. Tap Start Camera.</span></div>

<div class="actions">
<button id="cameraBtn" class="primary">Start camera</button>
<button id="recordBtn" disabled>● Record</button>
<button id="flipBtn" disabled>Flip camera</button>
</div>

<!-- Dedicated Channel Strip Faders -->
<section class="channel-strip">
  <div class="fader-card">
    <div class="fader-head"><label for="gain">🎚️ Input Gain</label><output id="gainVal">100%</output></div>
    <div class="fader-body">
      <input id="gain" class="v-slider" type="range" min="0" max="200" value="100" orient="vertical">
      <div class="meter-bridge"><div id="gainMeter" class="meter-fill"></div></div>
    </div>
  </div>
  <div class="fader-card">
    <div class="fader-head"><label for="compression">🎛️ Comp</label><output id="compressionVal">35%</output></div>
    <div class="fader-body">
      <input id="compression" class="v-slider" type="range" min="0" max="100" value="35" orient="vertical">
      <div class="meter-bridge"><div id="compMeter" class="meter-fill" style="height:35%;"></div></div>
    </div>
  </div>
</section>

<!-- Collapsible Accordion Drawers -->
<details class="drawer">
  <summary class="drawer-header"><span>Stompbox Presets</span></summary>
  <div class="drawer-content">
    <div class="presets">
      <button data-preset="clean">Clean</button><button data-preset="studio">Studio</button><button data-preset="hall">Big Hall</button><button data-preset="slap">Slapback</button><button data-preset="grit">Gritty</button>
    </div>
  </div>
</details>

<details class="drawer" open>
  <summary class="drawer-header"><span>Effects Console</span></summary>
  <div class="drawer-content">
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px;"><button id="offBtn" style="min-height:30px;padding:4px 8px;font-size:11px">Effects off</button></div>
    <div class="effectsgrid">
      <div class="control"><div class="labelrow"><label for="reverb">Reverb</label><output id="reverbVal">22%</output></div><input id="reverb" type="range" min="0" max="100" value="22"></div>
      <div class="control"><div class="labelrow"><label for="delay">Delay / echo</label><output id="delayVal">0%</output></div><input id="delay" type="range" min="0" max="100" value="0"></div>
      <div class="control"><div class="labelrow"><label for="distortion">Distortion</label><output id="distortionVal">0%</output></div><input id="distortion" type="range" min="0" max="100" value="0"></div>
      <div class="control"><div class="labelrow"><label for="eq">Tone / EQ</label><output id="eqVal">0 dB</output></div><input id="eq" type="range" min="-12" max="12" value="0"></div>
      <div class="control"><div class="labelrow"><label for="delayTime">Delay time</label><output id="delayTimeVal">280 ms</output></div><input id="delayTime" type="range" min="60" max="700" step="10" value="280"></div>
    </div>
  </div>
</details>

<details class="drawer">
  <summary class="drawer-header"><span>Recording Settings</span></summary>
  <div class="drawer-content">
    <div class="labelrow"><label for="quality">Resolution Request</label><select id="quality"><option value="1080">1080p</option><option value="720">720p</option></select></div>
    <span id="clock" class="small" style="display:block;margin-top:8px;">Elapsed: 00:00</span>
    <div id="error" role="status"></div>
  </div>
</details>

<section id="result" class="drawer-content" style="display:none;background:var(--panel);border-radius:10px;margin-bottom:10px;border:1px solid #424652;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
    <h2>Saved Project Player</h2>
    <button id="closeResultBtn" style="min-height:30px;padding:4px 8px;font-size:11px">Close Player</button>
  </div>
  <span id="fileInfo" class="small"></span>
  <input id="projectName" class="field" maxlength="100" placeholder="Name this performance" style="margin-top:8px;">
  <video id="recordedVideo" controls playsinline style="width:100%;max-height:400px;background:#000;border-radius:8px;margin-top:8px;"></video>
  <div style="margin-top:8px;display:flex;gap:8px;">
    <a id="downloadLink" hidden download="vocalcam-recording.webm" style="color:var(--accent);font-size:13px;font-weight:bold;">Download recording file</a>
  </div>
</section>

<details class="drawer" open>
  <summary class="drawer-header"><span>Project Library</span></summary>
  <div class="drawer-content">
    <div style="display:flex;justify-content:flex-end;margin-bottom:8px;"><button id="refreshLibrary" style="min-height:30px;padding:4px 8px;font-size:11px">Refresh</button></div>
    <div id="library" class="librarygrid"><div class="empty">Loading projects…</div></div>
  </div>
</details>
</main>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const preview = $('cameraPreview');
const statusEl = $('status');
const dot = $('dot');
const errorEl = $('error');

let cameraStream = null, audioContext = null, recorder = null, chunks = [];
let destination = null, cameraCanvas = null, canvasContext = null, frameLoop = null;
let isRecording = false, facing = 'environment', mirrored = false, timer = null, startedAt = 0;
let finalBlob = null, finalUrl = null, currentProjectId = null, currentProjectSettings = null;
const DB_NAME='VocalCamProjects', DB_VERSION=1, STORE='projects';

function openProjectDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE)){const store=db.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});store.createIndex('createdAt','createdAt');}};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Could not open local project storage.'));});}
function dbRequest(mode,fn){return openProjectDB().then(db=>new Promise((resolve,reject)=>{const tx=db.transaction(STORE,mode),store=tx.objectStore(STORE);let req;try{req=fn(store);}catch(e){db.close();reject(e);return;}tx.oncomplete=()=>{db.close();resolve(req?req.result:undefined);};tx.onerror=()=>{const e=tx.error;db.close();reject(e||new Error('Project storage failed.'));};tx.onabort=()=>{const e=tx.error;db.close();reject(e||new Error('Project storage was interrupted.'));};}));}
function snapshotSettings(){const ids=['reverb','delay','distortion','gain','eq','compression','delayTime','quality'];const out={};ids.forEach(id=>out[id]=$(id).value);return out;}
function applySettings(settings){if(!settings)return;Object.entries(settings).forEach(([id,value])=>{if($(id))$(id).value=value;});applyEffects();if(settings.quality&&$('quality').value!==settings.quality)$('quality').value=settings.quality;}
function formatDate(ms){try{return new Date(ms).toLocaleString();}catch(e){return 'Saved project';}}
async function persistCurrentProject(){if(!finalBlob)return;const name=$('projectName').value.trim()||'VocalCam recording';const project={name,blob:finalBlob,mime:finalBlob.type||'video/mp4',settings:currentProjectSettings||snapshotSettings(),createdAt:Date.now(),duration:Math.max(0,Date.now()-startedAt)};try{if(currentProjectId){project.id=currentProjectId;await dbRequest('readwrite',s=>s.put(project));}else{currentProjectId=await dbRequest('readwrite',s=>s.add(project));}await renderLibrary();}catch(e){error('Recording ready, but failed to save in library. '+(e.message||''));}}
async function getProjects(){return dbRequest('readonly',s=>s.getAll()).then(a=>(a||[]).sort((x,y)=>y.createdAt-x.createdAt));}
async function renderLibrary(){const root=$('library');try{const projects=await getProjects();if(!projects.length){root.innerHTML='<div class="empty">No projects yet. Record a video to save here.</div>';return;}root.innerHTML='';projects.forEach(p=>{const card=document.createElement('div');card.className='project';const title=document.createElement('div');title.className='projecttitle';title.textContent=p.name||'Untitled project';const meta=document.createElement('div');meta.className='projectmeta';meta.textContent=formatDate(p.createdAt)+' · '+(p.blob?(p.blob.size/1048576).toFixed(1)+' MB':'Video unavailable');const actions=document.createElement('div');actions.className='projectactions';const open=document.createElement('button');open.textContent='Open';open.addEventListener('click',()=>openProject(p.id));const exportBtn=document.createElement('button');exportBtn.textContent='Export';exportBtn.addEventListener('click',()=>exportProject(p.id,'share'));const del=document.createElement('button');del.textContent='Delete';del.addEventListener('click',()=>deleteProject(p.id));actions.append(open,exportBtn,del);card.append(title,meta,actions);root.append(card);});}catch(e){root.innerHTML='<div class="empty">Storage unavailable.</div>';}}

async function openProject(id){
  try{
    const p=(await getProjects()).find(x=>x.id===id);
    if(!p || !p.blob) {
      alert("Video data for this project is missing or empty.");
      return;
    }
    currentProjectId=p.id;
    finalBlob=p.blob;
    currentProjectSettings=p.settings||{};
    
    if(finalUrl) URL.revokeObjectURL(finalUrl);
    finalUrl = URL.createObjectURL(finalBlob);
    
    const vEl = $('recordedVideo');
    vEl.pause();
    vEl.removeAttribute('src');
    vEl.load();
    
    vEl.src = finalUrl;
    $('projectName').value = p.name || '';
    $('fileInfo').textContent = (finalBlob.size/1048576).toFixed(1) + ' MB (' + (finalBlob.type || 'video/mp4') + ')';
    $('result').style.display = 'block';
    $('result').scrollIntoView({behavior:'smooth', block:'start'});
    
    vEl.load();
    vEl.play().catch(err => {
      console.log("Autoplay blocked or waiting for user interaction:", err);
    });

    applySettings(currentProjectSettings);
  }catch(e){
    error('Could not open project: '+(e.message||''));
  }
}

async function deleteProject(id){if(!confirm('Delete project?'))return;try{await dbRequest('readwrite',s=>s.delete(id));if(currentProjectId===id){currentProjectId=null;finalBlob=null;$('result').style.display='none';}await renderLibrary();}catch(e){error('Could not delete: '+(e.message||''));}}
async function exportProject(id,mode){const p=(await getProjects()).find(x=>x.id===id);if(!p)return;const ext=(p.mime||'').includes('mp4')?'mp4':'webm';const file=new File([p.blob],(p.name||'vocalcam').replace(/[^a-z0-9 _-]/gi,'').trim()+'.'+ext,{type:p.mime||p.blob.type||'video/mp4'});if(mode==='share'&&navigator.share){try{await navigator.share({files:[file],title:p.name});return;}catch(e){}}const url=URL.createObjectURL(p.blob);const a=document.createElement('a');a.href=url;a.download=file.name;a.click();}
function status(message, live=false){statusEl.textContent=message;dot.classList.toggle('live',live);}
function error(message=''){errorEl.textContent=message;}
function timeString(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function bestMime(){if(!window.MediaRecorder)return '';const types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp8,opus','video/webm'];for(const t of types){try{if(MediaRecorder.isTypeSupported(t))return t;}catch(e){}}return '';}
function makeImpulse(ac,seconds=2.4,decay=2.4){const length=Math.floor(ac.sampleRate*seconds), b=ac.createBuffer(2,length,ac.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/length,decay);}return b;}
function distortionCurve(amount){const curve=new Float32Array(44100);const drive=1+amount*35,normalizer=Math.tanh(drive);for(let i=0;i<curve.length;i++){const x=i*2/(curve.length-1)-1;curve[i]=amount===0?x:Math.tanh(x*drive)/normalizer;}return curve;}

async function setupAudio(stream){
 if(audioContext){try{await audioContext.close();}catch(e){}}
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('AudioContext unsupported');
 audioContext=new AC();await audioContext.resume();
 const source=audioContext.createMediaStreamSource(stream);
 const eq=audioContext.createBiquadFilter();eq.type='peaking';eq.frequency.value=2500;eq.Q.value=.8;
 const shaper=audioContext.createWaveShaper();shaper.oversample='4x';
 const compressor=audioContext.createDynamicsCompressor();
 compressor.threshold.value=-22;compressor.knee.value=24;compressor.ratio.value=3;
 const inputGain=audioContext.createGain(), dry=audioContext.createGain(), convolver=audioContext.createConvolver(), reverb=audioContext.createGain();
 const delay=audioContext.createDelay(1.5), feedback=audioContext.createGain(), echo=audioContext.createGain();
 convolver.buffer=makeImpulse(audioContext);destination=audioContext.createMediaStreamDestination();
 source.connect(eq);eq.connect(inputGain);inputGain.connect(shaper);shaper.connect(compressor);
 compressor.connect(dry);dry.connect(destination);
 compressor.connect(convolver);convolver.connect(reverb);reverb.connect(destination);
 compressor.connect(delay);delay.connect(feedback);feedback.connect(delay);delay.connect(echo);echo.connect(destination);
 window.fx={eq,inputGain,shaper,compressor,reverb,delay,feedback,echo};applyEffects();
}

function applyEffects(){
 const fx=window.fx;if(!fx||!audioContext)return;
 const rev=+$('reverb').value/100, del=+$('delay').value/100, dist=+$('distortion').value/100, gain=+$('gain').value/100, eq=+$('eq').value, comp=+$('compression').value;
 fx.reverb.gain.setTargetAtTime(rev*.75,audioContext.currentTime,.025);
 fx.echo.gain.setTargetAtTime(del*.9,audioContext.currentTime,.025);
 fx.feedback.gain.setTargetAtTime(Math.min(.78,del*.74),audioContext.currentTime,.025);
 fx.delay.delayTime.setTargetAtTime(+$('delayTime').value/1000,audioContext.currentTime,.025);
 fx.inputGain.gain.setTargetAtTime(gain,audioContext.currentTime,.025);
 fx.shaper.curve=distortionCurve(dist);
 fx.eq.gain.setTargetAtTime(eq,audioContext.currentTime,.025);
 fx.compressor.threshold.setTargetAtTime(-8-comp*.32,audioContext.currentTime,.025);
 fx.compressor.ratio.setTargetAtTime(1+comp*.09,audioContext.currentTime,.025);
 $('reverbVal').textContent=Math.round(rev*100)+'%';$('delayVal').textContent=Math.round(del*100)+'%';
 $('distortionVal').textContent=Math.round(dist*100)+'%';$('gainVal').textContent=Math.round(gain*100)+'%';$('eqVal').textContent=(eq>0?'+':'')+eq+' dB';
 $('compressionVal').textContent=Math.round(comp*100)+'%';$('delayTimeVal').textContent=$('delayTime').value+' ms';
 
 $('gainMeter').style.height = Math.min(100, Math.round((gain / 200) * 100)) + '%';
 $('compMeter').style.height = comp + '%';
}

function drawFrame(){
 if(!cameraStream||!preview.videoWidth){frameLoop=requestAnimationFrame(drawFrame);return;}
 const w=cameraCanvas.width,h=cameraCanvas.height,vw=preview.videoWidth,vh=preview.videoHeight;
 const scale=Math.max(w/vw,h/vh), dw=vw*scale,dh=vh*scale,dx=(w-dw)/2,dy=(h-dh)/2;
 canvasContext.fillStyle='#000';canvasContext.fillRect(0,0,w,h);
 canvasContext.save();if(mirrored){canvasContext.translate(w,0);canvasContext.scale(-1,1);}
 canvasContext.drawImage(preview,dx,dy,dw,dh);canvasContext.restore();
 frameLoop=requestAnimationFrame(drawFrame);
}

async function stopCamera(){
 if(frameLoop)cancelAnimationFrame(frameLoop);frameLoop=null;
 if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;}
 preview.srcObject=null;if(audioContext){try{await audioContext.close();}catch(e){}audioContext=null;}
 destination=null;window.fx=null;
 $('cameraBtn').textContent='Start camera';$('recordBtn').disabled=true;$('flipBtn').disabled=true;
 status('Camera off. Tap Start Camera.');
}

async function startCamera(){
 error('');if(!window.isSecureContext){error('Requires HTTPS.');return;}
 $('cameraBtn').disabled=true;
 try{
  await stopCamera();
  const target=$('quality').value==='1080'?{width:1920,height:1080}:{width:1280,height:720};
  cameraStream=await navigator.mediaDevices.getUserMedia({
   audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},
   video:{facingMode:{ideal:facing},width:{ideal:target.width},height:{ideal:target.height},frameRate:{ideal:30,max:30}}
  });
  preview.srcObject=cameraStream;
  await new Promise((res,rej)=>{preview.onloadedmetadata=res;setTimeout(rej,8000);});
  await preview.play();mirrored=facing==='user';
  preview.style.transform=mirrored?'scaleX(-1)':'none';
  cameraCanvas=document.createElement('canvas');cameraCanvas.width=target.width;cameraCanvas.height=target.height;
  canvasContext=cameraCanvas.getContext('2d');
  await setupAudio(cameraStream);drawFrame();
  $('cameraBtn').textContent='Stop camera';$('recordBtn').disabled=false;$('flipBtn').disabled=false;
  status('Camera ready.',true);
 }catch(e){error('Camera failed: '+e.message);status('Camera unavailable.');}finally{$('cameraBtn').disabled=false;}
}

async function flipCamera(){if(isRecording)return;facing=facing==='user'?'environment':'user';await startCamera();}

function startRecording(){
 error('');if(!cameraStream||!destination)return;
 const mime=bestMime();if(!mime)return;
 const videoStream=cameraCanvas.captureStream(30);
 const combined=new MediaStream([...videoStream.getVideoTracks(),...destination.stream.getAudioTracks()]);
 chunks=[];currentProjectSettings=snapshotSettings();currentProjectId=null;
 recorder=new MediaRecorder(combined,{mimeType:mime,videoBitsPerSecond:6000000,audioBitsPerSecond:192000});
 recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
 recorder.onstop=()=>{
  finalBlob=new Blob(chunks,{type:recorder.mimeType||mime});
  if(finalUrl)URL.revokeObjectURL(finalUrl);finalUrl=URL.createObjectURL(finalBlob);
  const vEl = $('recordedVideo');
  vEl.src = finalUrl;
  vEl.load();
  $('downloadLink').href=finalUrl;
  $('downloadLink').hidden=false;
  $('projectName').value='VocalCam '+new Date().toLocaleString();
  $('fileInfo').textContent=(finalBlob.size/1048576).toFixed(1)+' MB · '+(finalBlob.type||'video/mp4');
  $('result').style.display='block';$('result').scrollIntoView({behavior:'smooth'});
  $('recordBtn').textContent='● Record';$('recordBtn').classList.remove('recording');isRecording=false;
  $('cameraBtn').disabled=false;$('flipBtn').disabled=false;clearInterval(timer);
  videoStream.getTracks().forEach(t=>t.stop());
  persistCurrentProject();
 };
 recorder.start(1000);isRecording=true;startedAt=Date.now();
 timer=setInterval(()=>$('clock').textContent='Elapsed: '+timeString(Date.now()-startedAt),500);
 $('recordBtn').textContent='■ Stop';$('recordBtn').classList.add('recording');$('cameraBtn').disabled=true;$('flipBtn').disabled=true;
 status('Recording video with audio effects…',true);
}

function stopRecording(){if(recorder&&isRecording&&recorder.state!=='inactive')recorder.stop();}

$('cameraBtn').addEventListener('click',async()=>{if(isRecording)return;if(cameraStream)await stopCamera();else await startCamera();});
$('recordBtn').addEventListener('click',()=>isRecording?stopRecording():startRecording());
$('flipBtn').addEventListener('click',flipCamera);
$('closeResultBtn').addEventListener('click',()=>{$('result').style.display='none';});
document.querySelectorAll('input[type=range]').forEach(el=>el.addEventListener('input',applyEffects));renderLibrary();
$('offBtn').addEventListener('click',()=>{['reverb','delay','distortion'].forEach(id=>$(id).value=0);$('gain').value=100;$('eq').value=0;$('compression').value=0;applyEffects();});
const presets={
 clean:{reverb:0,delay:0,distortion:0,eq:0,compression:15,delayTime:220},
 studio:{reverb:18,delay:0,distortion:0,eq:2,compression:40,delayTime:280},
 hall:{reverb:72,delay:12,distortion:0,eq:1,compression:25,delayTime:420},
 slap:{reverb:8,delay:32,distortion:0,eq:1,compression:30,delayTime:115},
 grit:{reverb:8,delay:0,distortion:28,eq:3,compression:60,delayTime:260}
};
document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{Object.entries(presets[b.dataset.preset]).forEach(([id,v])=>$(id).value=v);applyEffects();}));
$('projectName').addEventListener('change',persistCurrentProject);
$('refreshLibrary').addEventListener('click',renderLibrary);
})();
</script>
</body>
</html>
