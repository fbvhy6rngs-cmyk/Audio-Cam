<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VocalCam">
<title>VocalCam - Studio Console</title>
<style>
:root{color-scheme:dark;--bg:#090a0c;--panel:#15171b;--panel2:#1f2228;--text:#f6f7fb;--muted:#a5aab4;--accent:#ff5a36;--line:#343842;--meter:#30d158}
*{box-sizing:border-box}
body{margin:0;padding:env(safe-area-inset-top) 12px calc(24px + env(safe-area-inset-bottom));background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:980px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 2px}
h1{font-size:22px;margin:0;letter-spacing:.04em;font-weight:900;text-transform:uppercase}
h2{font-size:15px;margin:0;text-transform:uppercase;letter-spacing:.08em}
.studio-tag{font-size:10px;letter-spacing:.18em;color:#ff8b70;font-weight:900;text-transform:uppercase}
.pill{border:1px solid var(--line);border-radius:99px;padding:4px 8px;font-size:11px;color:var(--muted)}

/* Preview Frame */
.preview{aspect-ratio:16/9;width:100%;min-height:220px;background:#000;border:2px solid #3e424c;border-radius:12px;overflow:hidden;position:relative;box-shadow:0 10px 28px #0008}
#cameraPreview{width:100%;height:100%;object-fit:cover;background:#000}
.status{display:flex;gap:8px;align-items:center;margin:10px 2px 12px;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#7c8290;flex:none}.dot.live{background:var(--accent)}

/* Main Toolbar */
.actions{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:9px;margin-bottom:16px}
button{font:inherit;color:var(--text);background:linear-gradient(180deg,#2a2d34,#1b1d22);border:1px solid #454953;border-radius:8px;padding:10px 8px;min-height:44px;box-shadow:inset 0 1px #ffffff0d,0 3px 0 #070809;transition:filter .12s,transform .12s;cursor:pointer}
button:active{transform:translateY(2px);box-shadow:inset 0 1px #ffffff0d,0 1px 0 #070809}
button:disabled{opacity:.45}
button.primary{background:linear-gradient(180deg,#ff704d,#d93b25);border-color:#ff886c;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
button.recording{background:linear-gradient(180deg,#b82132,#72101c);border-color:#f04b5a}

/* Studio Channel Strip (Gain & Dynamics) */
.channel-strip{display:grid;
